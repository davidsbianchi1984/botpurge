[project]
name = "botpurge"
version = "1.1.0"
description = "Bot Purge — flag and remove bots from your friends, followers and following; purge bots platform-wide with appeals"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=41",
]

[project.optional-dependencies]
vision = ["Pillow>=10", "opencv-python-headless>=4.8,<5"]
desktop = ["pywebview>=5", "playwright>=1.40", "Pillow>=10", "opencv-python-headless>=4.8,<5"]  # opencv 5 dropped the bundled face models
dev = ["pytest>=8", "Pillow>=10", "opencv-python-headless>=4.8,<5"]

[project.scripts]
botpurge = "botpurge.__main__:main"
botpurge-desktop = "botpurge.desktop:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botpurge*"]

[tool.setuptools.package-data]
botpurge = ["web/*", "license_public.txt", "release.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
